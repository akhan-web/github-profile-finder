<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github profile finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="change">
        <img id="mode" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRilQ-GYTGjau0edR34YhzwfgbOXO4TS9KHWUbiBhsPfRSOAWBK-wdolK4l&s=10" alt="" >
    </button>
    <div class="container">
        <h1 id="text">Github Profile Finder</h1>
        <h3>Find GitHub users around the world</h3>
        <div class="search">
            <input id="input" type="text" placeholder="Enter username...">
            <button id="search">Search</button>
        </div>
    </div>
    <div class="bigbox">
    <div class="name">
          <img id="image" src="https://brand.github.com/_next/static/media/logo-03.cc5e5332.png" alt="">
        <p id="anothertext">Ready to search?</p>
        <p id="anotherheading">Enter a GitHub username above to discover their profile, repositories, and followers.</p>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
